  /msg/send_live_photo:
    post:
      summary: ''
      x-module: Msg
      x-params-source: apifox-schema
      requestBody:
        content:
          application/json:
            schema:
              title: SendLivePhotoModel
              required:
              - guid
              - to_username
              - photo
              type: object
              properties:
                guid:
                  title: Guid
                  minLength: 1
                  type: string
                  description: 实例 ID。
                to_username:
                  title: To Username
                  minLength: 1
                  type: string
                  description: 接收方 username，支持好友或群聊。
                photo:
                  title: Photo
                  allOf:
                  - title: MergedLivePhoto
                    required:
                    - file_id
                    - aes_key
                    - display
                    - thumbnail
                    - video
                    - duration_ms
                    type: object
                    properties:
                      file_id:
                        title: File Id
                        minLength: 1
                        type: string
                        description: 实况复合上传返回的 CDN 文件 ID。
                      aes_key:
                        title: Aes Key
                        pattern: ^(?:[0-9a-fA-F]{32})?$
                        type: string
                        description: 上传返回的 32 位十六进制密钥；明确命中已有资源时允许空字符串。
                      display:
                        title: Display
                        allOf:
                        - title: LivePhotoDisplay
                          required:
                          - size
                          type: object
                          properties:
                            size:
                              title: Size
                              maximum: 2147483647.0
                              exclusiveMinimum: 0.0
                              type: integer
                              description: 显示图明文大小，单位字节。
                          additionalProperties: false
                          x-apifox-orders:
                          - size
                        description: 显示图明文大小。
                      thumbnail:
                        title: Thumbnail
                        allOf:
                        - title: ImageThumbnail
                          required:
                          - size
                          - width
                          - height
                          type: object
                          properties:
                            size:
                              title: Size
                              maximum: 2147483647.0
                              exclusiveMinimum: 0.0
                              type: integer
                              description: 缩略图明文大小，单位字节。
                            width:
                              title: Width
                              maximum: 2147483647.0
                              exclusiveMinimum: 0.0
                              type: integer
                              description: 缩略图宽度，单位像素。
                            height:
                              title: Height
                              maximum: 2147483647.0
                              exclusiveMinimum: 0.0
                              type: integer
                              description: 缩略图高度，单位像素。
                          additionalProperties: false
                          x-apifox-orders:
                          - size
                          - width
                          - height
                        description: 缩略图明文大小和尺寸。
                      video:
                        title: Video
                        allOf:
                        - title: LivePhotoVideo
                          required:
                          - size
                          - md5
                          type: object
                          properties:
                            size:
                              title: Size
                              maximum: 4294967295.0
                              exclusiveMinimum: 0.0
                              type: integer
                              description: 普通视频明文大小，单位字节。
                            md5:
                              title: Md5
                              maxLength: 32
                              minLength: 32
                              pattern: ^[0-9a-fA-F]{32}$
                              type: string
                              description: 普通视频的 MD5，32 位十六进制字符串。
                          additionalProperties: false
                          x-apifox-orders:
                          - size
                          - md5
                        description: 普通视频明文大小和 MD5。
                      duration_ms:
                        title: Duration Ms
                        maximum: 4294967295.0
                        exclusiveMinimum: 0.0
                        type: integer
                        description: 实况时长，单位毫秒。
                      still_image_time_ms:
                        title: Still Image Time Ms
                        maximum: 4294967295.0
                        minimum: 0.0
                        type: integer
                        description: 静态帧位置，单位毫秒，默认 0。
                        default: 0
                      original:
                        title: Original
                        allOf:
                        - title: ImageVariant
                          required:
                          - size
                          - md5
                          type: object
                          properties:
                            size:
                              title: Size
                              maximum: 2147483647.0
                              exclusiveMinimum: 0.0
                              type: integer
                              description: 图片明文大小，单位字节。
                            md5:
                              title: Md5
                              maxLength: 32
                              minLength: 32
                              pattern: ^[0-9a-fA-F]{32}$
                              type: string
                              description: 对应图片文件的 MD5，32 位十六进制字符串。
                          additionalProperties: false
                          x-apifox-orders:
                          - size
                          - md5
                        description: 原图明文大小和 MD5。
                      hd_video:
                        title: Hd Video
                        allOf:
                        - title: LivePhotoHDVideo
                          required:
                          - size
                          type: object
                          properties:
                            size:
                              title: Size
                              maximum: 4294967295.0
                              exclusiveMinimum: 0.0
                              type: integer
                              description: 高清视频明文大小，单位字节。
                            md5:
                              title: Md5
                              pattern: ^(?:[0-9a-fA-F]{32})?$
                              type: string
                              description: 高清视频摘要，可省略；服务不会自动生成此消息字段。
                          additionalProperties: false
                          x-apifox-orders:
                          - size
                          - md5
                        description: 高清视频；与 original 成对提供。
                      hit_md5:
                        title: Hit Md5
                        type: boolean
                        description: 是否命中已有资源，默认 false。
                        default: false
                      origin_source_md5:
                        title: Origin Source Md5
                        maxLength: 32
                        minLength: 32
                        pattern: ^[0-9a-fA-F]{32}$
                        type: string
                        description: 已知的来源图片摘要，可选透传。
                      hevc_mid_size:
                        title: Hevc Mid Size
                        maximum: 4294967295.0
                        minimum: 0.0
                        type: integer
                        description: 已知的 HEVC 显示图大小，可选透传。
                      security_hash:
                        title: Security Hash
                        minLength: 1
                        type: string
                        description: 已知的安全摘要，可选透传。
                    additionalProperties: false
                    x-apifox-orders:
                    - file_id
                    - aes_key
                    - display
                    - thumbnail
                    - video
                    - duration_ms
                    - still_image_time_ms
                    - original
                    - hd_video
                    - hit_md5
                    - origin_source_md5
                    - hevc_mid_size
                    - security_hash
                  description: 实况上传返回的 merged_live_photo 对象；支持普通实况和实况原图。
              additionalProperties: false
              x-apifox-orders:
              - guid
              - to_username
              - photo
      responses:
        '200':
          description: 协议侧响应，结构见 apifox/协议文档
