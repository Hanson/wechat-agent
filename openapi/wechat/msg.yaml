                    - display
                    - thumbnail
                    type: object
                    properties:
                      file_id:
                        title: File Id
                        minLength: 1
                        type: string
                        description: 图片上传返回的 CDN 文件 ID。
                      aes_key:
                        title: Aes Key
                        maxLength: 32
                        minLength: 32
                        pattern: ^[0-9a-fA-F]{32}$
                        type: string
                        description: 图片上传返回的密钥，32 位十六进制字符串。
                      display:
                        title: Display
                        allOf:
                        - title: ImageDisplay
                          required:
                          - size
                          type: object
                          properties:
                            size:
                              title: Size
                              maximum: 2147483647.0
                              exclusiveMinimum: 0.0
                              type: integer
                              description: 显示图明文大小，单位字节。
                            md5:
                              title: Md5
                              maxLength: 32
                              minLength: 32
                              pattern: ^[0-9a-fA-F]{32}$
                              type: string
                              description: 普通图发送时必填；原图发送时可省略或为 null。
                              nullable: true
                          additionalProperties: false
                          x-apifox-orders:
